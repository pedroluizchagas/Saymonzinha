<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline • Saymon Cell Admin</title>
    <meta name="theme-color" content="#ff0200" />
    <style>
      :root { color-scheme: light dark }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans', 'Helvetica Neue', Arial, sans-serif;
        background: #0a0a0a;
        color: #fafafa;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      .card {
        width: min(560px, 92vw);
        border: 1px solid #262626;
        border-radius: 16px;
        padding: 24px;
        background: #111111;
        box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      }
      h1 { font-size: 1.25rem; margin: 0 0 4px }
      p { margin: 0 0 16px; color: #a3a3a3 }
      .actions { display: flex; gap: 12px; margin-top: 8px }
      a, button {
        appearance: none;
        border: 1px solid #262626;
        background: #171717;
        color: #fafafa;
        padding: 10px 14px;
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        border-color: #ff0200;
        background: #ff0200;
        color: white;
      }
      .muted { color: #a3a3a3; font-size: .875rem }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sua conexão caiu</h1>
      <p>Não foi possível carregar o painel do admin porque você está offline.</p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Tentar novamente</button>
        <a href="/" aria-label="Ir para a página inicial">Página inicial</a>
      </div>
      <p class="muted">Quando a conexão voltar, o painel será recarregado automaticamente.</p>
    </div>
  </body>
  </html>
