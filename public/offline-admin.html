<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão · Painel Saymon Cell</title>
    <meta name="theme-color" content="#0a0908" />
    <!-- Página que o service worker mostra quando o painel abre sem internet. Sem as fontes do site
         (podem não estar guardadas), com a cara da tela de bloqueio do painel; recarrega sozinha quando a
         conexão volta. -->
    <style>
      * { box-sizing: border-box }
      html { color-scheme: dark; background: #0a0908 }
      /* iOS 26 no app instalado: com o documento mais baixo que a tela, o iOS entrega uma área mais curta,
         na altura da barra de status (WebKit 301108); a mesma regra do painel (app/globals.css) */
      @media (display-mode: standalone) {
        html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px))) }
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(120% 55% at 50% 112%, rgba(255, 2, 0, 0.42), transparent 62%),
          #0a0908;
        color: #f4f3f0;
        font: 400 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: min(400px, 100%); text-align: center }
      .icon {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        margin: 0 auto 28px;
        border-radius: 18px;
        background: #ff0200;
        box-shadow: 0 30px 60px -30px rgba(255, 2, 0, 0.6);
      }
      .icon img { height: 44px; width: auto }
      .label {
        margin: 0 0 12px;
        color: #a6a29b;
        font: 500 11px/1.2 ui-monospace, "SFMono-Regular", Menlo, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font: 900 64px/0.84 "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif;
        font-stretch: condensed;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }
      p.text { margin: 18px 0 28px; color: #a6a29b }
      .actions { display: grid; gap: 10px }
      button, a {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        font: 500 14px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-decoration: none;
        cursor: pointer;
      }
      button { background: #e50000; color: #fff }
      a { background: rgba(255, 255, 255, 0.08); color: #f4f3f0 }
      :focus-visible { outline: 2px solid #ff0200; outline-offset: 2px }
    </style>
  </head>
  <body>
    <main>
      <span class="icon" aria-hidden="true"><img src="/home/glyph.png" alt="" /></span>
      <p class="label">Painel Saymon Cell</p>
      <h1>Sem conexão</h1>
      <p class="text">O painel volta sozinho quando a internet voltar. Se preferir, tente agora.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Tentar de novo</button>
        <a href="/">Ir para o site</a>
      </div>
    </main>
    <script>
      // Recarrega quando a conexão volta, como o texto promete.
      window.addEventListener("online", function () {
        location.reload()
      })
    </script>
  </body>
</html>
